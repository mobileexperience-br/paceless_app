name: Preview on main

on:
  push:
    branches:
      - main

jobs:
  fingerprint:
    type: fingerprint
    environment: preview
  find_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
  build_android:
    name: Android preview build
    needs: [find_android_build]
    if: ${{ !needs.find_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview
  publish_update:
    name: Preview update
    needs: [find_android_build]
    if: ${{ needs.find_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      channel: preview
      platform: android
      message: Preview from main ${{ github.sha }}
