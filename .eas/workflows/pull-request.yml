name: Pull request checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  checks:
    name: Typecheck and lint
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint . --max-warnings 0
